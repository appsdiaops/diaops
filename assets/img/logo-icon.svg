<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DiaOps logo">
  <defs>
    <linearGradient id="topG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5bb6ec"/>
      <stop offset="1" stop-color="#3a8fd0"/>
    </linearGradient>
    <linearGradient id="leftG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fb0"/>
      <stop offset="1" stop-color="#1b3f78"/>
    </linearGradient>
    <linearGradient id="rightG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23538f"/>
      <stop offset="1" stop-color="#14305f"/>
    </linearGradient>
  </defs>
  <!-- outer cube -->
  <polygon points="90,29 50,52 50,94 90,71" fill="url(#rightG)"/>
  <polygon points="10,29 50,52 50,94 10,71" fill="url(#leftG)"/>
  <polygon points="50,6 90,29 50,52 10,29" fill="url(#topG)"/>
  <!-- open hexagonal core (cut-out look) -->
  <polygon points="50,28 68,38 68,58 50,68 32,58 32,38" fill="#ffffff"/>
  <polygon points="50,33 63,40.5 50,48 37,40.5" fill="url(#topG)" opacity="0.25"/>
</svg>
